asyncapi: 3.0.0
info:
  title: External Ref + $id
  version: 2.0.1
  description: >-
    Payloads reference an external file (shared/common.yaml) that carries its own
    $id base URI. Exercises the parser bundling/dereference + $id base-resolution
    correctness bar (§5, §12.4): the external Identifier's `pattern` must be inlined
    and enforced under Ajv 2020 standalone, and a bad nodeId must be rejected.
    KNOWN LIMITATION (DECISIONS.md D-005): a `$ref` SIBLING keyword (`minLength`,
    below) is meant to apply under 2020-12 but is silently dropped by
    @asyncapi/parser's draft-07 schema parser — the §12.4 silent-wrongness, deferred
    to a dedicated 2020-12 schema-parser spike.
servers:
  mosquitto:
    host: localhost:1883
    protocol: mqtt
    protocolVersion: '3.1.1'
channels:
  telemetry:
    address: telemetry/{nodeId}
    parameters:
      nodeId:
        description: Node identifier
    messages:
      Telemetry:
        $ref: '#/components/messages/Telemetry'
operations:
  publishTelemetry:
    action: send             # toClient
    channel:
      $ref: '#/channels/telemetry'
components:
  messages:
    Telemetry:
      name: Telemetry
      payload:
        $ref: '#/components/schemas/Telemetry'
  schemas:
    Telemetry:
      type: object
      required: [nodeId, recordedAt, value]
      additionalProperties: false
      properties:
        nodeId:
          # $ref + SIBLING keyword. Under 2020-12 `minLength` would apply ALONGSIDE the ref's
          # `pattern`; @asyncapi/parser normalizes to draft-07, which DROPS $ref siblings — so
          # minLength is NOT enforced (KNOWN LIMITATION, D-005, §12.4). The external `pattern`
          # IS inlined + enforced. See the tripwire in registry/index.test.ts.
          $ref: 'shared/common.yaml#/$defs/Identifier'
          minLength: 3
        recordedAt:
          $ref: 'shared/common.yaml#/$defs/Timestamp'
        value:
          type: number
