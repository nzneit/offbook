asyncapi: 3.0.0
info:
  title: External Ref + $id
  version: 2.0.1
  description: >-
    Payloads reference an external file (shared/common.yaml) that carries its own
    $id base URI. Exercises the parser bundling/dereference + $id base-resolution
    correctness bar (§5, §12.4): the external Identifier's `pattern` must be inlined
    and enforced under Ajv standalone, and a bad nodeId must be rejected.
    Also carries a `$ref` SIBLING keyword (`minLength`, below): a 2020-12 reader
    would honor it, a draft-07 reader ignores it, and draft-07 is the dialect BOTH
    spec majors declare and the parser emits, so offbook validating under it means
    the sibling is correctly NOT enforced (D-018 supersedes D-005's deferred 2020-12
    spike). A tripwire test pins this so a future dialect change is loud.
servers:
  mosquitto:
    host: localhost:1883
    protocol: mqtt
    protocolVersion: '3.1.1'
channels:
  telemetry:
    address: telemetry/{nodeId}
    parameters:
      nodeId:
        description: Node identifier
    messages:
      Telemetry:
        $ref: '#/components/messages/Telemetry'
operations:
  publishTelemetry:
    action: send             # toClient
    channel:
      $ref: '#/channels/telemetry'
components:
  messages:
    Telemetry:
      name: Telemetry
      payload:
        $ref: '#/components/schemas/Telemetry'
  schemas:
    Telemetry:
      type: object
      required: [nodeId, recordedAt, value]
      additionalProperties: false
      properties:
        nodeId:
          # $ref + SIBLING keyword. A 2020-12 reader would apply `minLength` ALONGSIDE the ref's
          # `pattern`; a draft-07 reader ignores $ref siblings, and draft-07 is the dialect BOTH
          # spec majors declare and the parser emits, so offbook validating under it means
          # minLength is correctly NOT enforced (D-018 supersedes D-005's deferred 2020-12 spike).
          # The external `pattern` IS inlined + enforced. The tripwire in registry/index.test.ts
          # pins this so a future dialect change is loud rather than silent.
          $ref: 'shared/common.yaml#/$defs/Identifier'
          minLength: 3
        recordedAt:
          $ref: 'shared/common.yaml#/$defs/Timestamp'
        value:
          type: number
